name: vaultmind

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: vaultmind-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api
    container_name: vaultmind-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_healthy
