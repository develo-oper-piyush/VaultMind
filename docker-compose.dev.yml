name: vaultmind-dev

services:
    backend-dev:
        build:
            context: ./Backend
            dockerfile: Dockerfile
        container_name: vaultmind-backend-dev
        command: npm run dev
        ports:
            - "5000:5000"
        volumes:
            - ./Backend:/app
            - /app/node_modules
        env_file:
            - path: ./Backend/env
              required: false
        environment:
            - PORT=5000
            - FRONTEND_URL=http://localhost:3000
            - NODE_ENV=development

    frontend-dev:
        build:
            context: ./Frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_URL: http://localhost:5000/api
        container_name: vaultmind-frontend-dev
        command: npm run dev -- -p 3000
        ports:
            - "3000:3000"
        volumes:
            - ./Frontend:/app
            - /app/node_modules
            - /app/.next
        environment:
            - NODE_ENV=development
            - NEXT_PUBLIC_API_URL=http://localhost:5000/api
        depends_on:
            - backend-dev
